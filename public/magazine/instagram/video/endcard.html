<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Oswald";
      src: url("../ultimate-rider/fonts/Oswald.ttf") format("truetype");
      font-weight: 200 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0D0D0D; }
    .card {
      width: 1080px;
      height: 1920px;
      background:
        radial-gradient(ellipse at 50% 32%, #2a1a12 0%, #0D0D0D 62%);
      color: #F1E9DD;
      font-family: "Oswald", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 220px 70px 260px;
    }
    .kicker { font-size: 22px; letter-spacing: 0.42em; color: #E8622C; margin-bottom: 28px; }
    .drc { font-size: 178px; line-height: 0.82; font-weight: 600; letter-spacing: 0.04em; }
    .d { color: #F1E9DD; } .r { color: #E8622C; } .c { color: #F1E9DD; }
    .title { margin-top: 12px; font-size: 52px; letter-spacing: 0.18em; font-weight: 500; }
    .flag { margin-top: 22px; font-size: 26px; letter-spacing: 0.2em; color: #E8622C; }
    .join { margin-top: 70px; font-size: 42px; letter-spacing: 0.2em; }
    .when { margin-top: 18px; font-size: 24px; letter-spacing: 0.16em; color: #B9A886; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="kicker">JOIN THE RACE</div>
    <div class="drc"><span class="d">D</span><span class="r">R</span><span class="c">C</span></div>
    <div class="title">ULTIMATE RIDER</div>
    <div class="flag">THE FLAG-OFF OF DRC RACING</div>
    <div class="join">EARN THE START LINE</div>
    <div class="when">12–13 DECEMBER 2026<br />TRIBAL ADVENTURE · BENGALURU</div>
  </div>
</body>
</html>
