<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DRC logo kit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0B0B0B; color: #F3EEE4; font-family: Georgia, serif; }
    body { padding: 48px 8vw 80px; }
    h1 { font-family: Arial, sans-serif; letter-spacing: 0.18em; font-size: 13px; text-transform: uppercase; color: #7A3CFF; margin-bottom: 8px; }
    p { opacity: 0.7; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    figure { background: #111; border: 1px solid #1c1c1c; padding: 28px; }
    figure img { width: 100%; display: block; }
    figcaption { font-family: Arial, sans-serif; letter-spacing: 0.16em; font-size: 11px; text-transform: uppercase; margin-top: 16px; opacity: 0.5; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>DRC — Dirt Ride Camp</h1>
  <p>Test the rider. Test the motorcycle. Emblems you can stamp, stitch, and put on the site.</p>
  <div class="grid">
    <figure>
      <img src="drc-logo-symbol.png" alt="DRC symbol — hand becoming a tire" />
      <figcaption>Symbol — the mark</figcaption>
    </figure>
    <figure>
      <img src="drc-logo-seal.png" alt="DRC circular seal" />
      <figcaption>Seal — sticker, avatar, race plate</figcaption>
    </figure>
    <figure>
      <img src="drc-logo-badge.png" alt="DRC horizontal badge" />
      <figcaption>Badge — header, jersey chest</figcaption>
    </figure>
    <figure>
      <img src="drc-logo-01-wordmark.png" alt="DRC geometric wordmark" />
      <figcaption>01 Wordmark — geometric, orange R</figcaption>
    </figure>
    <figure>
      <img src="drc-logo-02-italic-on-tar.png" alt="DRC italic motorsports wordmark" />
      <figcaption>02 Italic — race lockup</figcaption>
    </figure>
    <figure style="background:#fff;border-color:#e8e2d8">
      <img src="drc-logo-03-seal.png" alt="DRC circular seal" />
      <figcaption style="color:#0B0B0B">03 Seal — sticker, avatar</figcaption>
    </figure>
    <figure style="background:#fff;border-color:#e8e2d8">
      <img src="drc-logo-04-icon.png" alt="DRC app icon" />
      <figcaption style="color:#0B0B0B">04 Icon — app / social</figcaption>
    </figure>
    <figure style="background:#fff;border-color:#e8e2d8">
      <img src="drc-logo-05-badge.png" alt="DRC horizontal badge" />
      <figcaption style="color:#0B0B0B">05 Badge — header, jersey</figcaption>
    </figure>
    <figure style="background:#fff;border-color:#e8e2d8">
      <img src="drc-logo-06-rider.png" alt="DRC rider lockup" />
      <figcaption style="color:#0B0B0B">06 Rider — motorsports lockup</figcaption>
    </figure>
  </div>
</body>
</html>
